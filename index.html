<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sermon Yeast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600;6..72,700&family=Noto+Sans+KR:wght@500;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260602-4">
  </head>
  <body>
    <main class="edition-shell">
      <header class="masthead">
        <div class="kicker">SSN RV Seminar Archive</div>
        <h1>Sermon Yeast</h1>
        <div class="rule"></div>
        <p>Five exact excerpts from the archive.</p>
      </header>

      <section class="controls" aria-label="Generate quotes">
        <button id="generateButton" type="button">Generate 5 Quotes</button>
        <div class="edition-meta">
          <span id="editionDate"></span>
          <span id="sourceCount"></span>
        </div>
      </section>

      <section id="quoteGrid" class="quote-grid" aria-live="polite"></section>

      <section id="savedSection" class="saved-section" aria-label="Saved quotes">
        <div class="section-heading">
          <h2>Saved Quotes</h2>
          <span id="savedCount"></span>
        </div>
        <div id="savedList" class="saved-list"></div>
      </section>
    </main>

    <template id="quoteTemplate">
      <article class="quote-card">
        <div class="source-row">
          <span class="source-title"></span>
          <button class="save-button" type="button" aria-label="Save quote">Save</button>
        </div>
        <blockquote></blockquote>
      </article>
    </template>

    <script src="app.js?v=20260602-3"></script>
  </body>
</html>
